[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Placeholder only.  The effective URL is resolved in alembic/env.py from
# server.config.DATABASE_URL (ITDN_DATABASE_URL, else SQLite at ITDN_DB_PATH)
# so migrations and the running server can never target different databases.
# Override for a one-off run with:  alembic -x db_url=postgresql://... upgrade head
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
