version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: threatuser
      POSTGRES_PASSWORD: threatpass
      POSTGRES_DB: threatdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threatuser -d threatdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn server.main:app --host 0.0.0.0 --port 8443
    environment:
      SERVER_DATABASE_URL: "postgresql+asyncpg://threatuser:threatpass@postgres:5432/threatdb"
      SERVER_API_KEY: "${SERVER_API_KEY:-changeme}"
      SERVER_RISK_THRESHOLD: "80.0"
    ports:
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ca:/app/ca

volumes:
  pgdata:
