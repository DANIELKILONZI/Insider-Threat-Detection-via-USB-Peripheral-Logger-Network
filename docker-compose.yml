version: "3.9"

# ── ITDN – Docker Compose for development / small-scale testing ───────────────
#
# Production deployments push the server image to a private registry and run
# agents via enterprise endpoint management (GPO, Ansible, SCCM, etc.) with
# the ITDN_SERVER_URL env var pointing at the isolated VLAN SIEM server.
#
# Usage:
#   docker compose up --build
#
# The agent container uses --privileged + host network to access USB devices.

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: itdn-server
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - itdn-db:/var/lib/itdn
      - itdn-logs:/var/log/itdn
    environment:
      ITDN_DB_PATH: /var/lib/itdn/itdn.db
      ITDN_SERVER_HOST: "0.0.0.0"
      ITDN_SERVER_PORT: "8443"
      # Set these in a .env file or secret manager:
      SPLUNK_HEC_URL: "${SPLUNK_HEC_URL:-}"
      SPLUNK_HEC_TOKEN: "${SPLUNK_HEC_TOKEN:-}"
      SPLUNK_INDEX: "${SPLUNK_INDEX:-itdn}"
      ITDN_AFTER_HOURS_START: "${ITDN_AFTER_HOURS_START:-22}"
      ITDN_AFTER_HOURS_END: "${ITDN_AFTER_HOURS_END:-6}"
      ITDN_VOLUME_THRESHOLD_BYTES: "${ITDN_VOLUME_THRESHOLD_BYTES:-1073741824}"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8443/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: itdn-agent
    restart: unless-stopped
    privileged: true           # required for udev USB access
    network_mode: host         # required for host USB/BT device visibility
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - itdn-agent-logs:/var/log/itdn
    environment:
      ITDN_SERVER_URL: "http://localhost:8443"   # use https + cert paths in prod
      ITDN_HOSTNAME: "${HOSTNAME:-agent-host}"
      ITDN_LOG_DIR: /var/log/itdn
      ITDN_FLUSH_INTERVAL: "10"
      ITDN_BT_ENABLED: "true"
      ITDN_LOG_LEVEL: "INFO"

volumes:
  itdn-db:
  itdn-logs:
  itdn-agent-logs:
