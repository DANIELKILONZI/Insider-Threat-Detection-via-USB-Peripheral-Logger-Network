# Example Splunk saved searches for ITDN
#
# Import these into Splunk Enterprise Security under:
#   Settings → Searches, Reports, and Alerts → New Search
#
# All searches target the "itdn" index.  Adjust the index name if different.

[ITDN - After Hours USB Activity - Rule]
search = index=itdn sourcetype="itdn:alert" rule_name="after_hours_device" \
  | eval risk_score=80 \
  | table _time, hostname, device_id, severity, description
dispatch.earliest_time = -24h
dispatch.latest_time = now
cron_schedule = */15 * * * *
alert.severity = 3
alert.track = 1
action.email.to = soc@example.com
alert.condition = search count > 0

[ITDN - High Volume Transfer - Rule]
search = index=itdn sourcetype="itdn:alert" rule_name="high_volume_transfer" \
  | eval risk_score=95 \
  | table _time, hostname, device_id, severity, description
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */5 * * * *
alert.severity = 4
alert.track = 1
action.email.to = soc@example.com
alert.condition = search count > 0

[ITDN - Unknown Device - Rule]
search = index=itdn sourcetype="itdn:alert" rule_name="unknown_device" \
  | table _time, hostname, device_id, severity, description
dispatch.earliest_time = -1h
dispatch.latest_time = now
cron_schedule = */10 * * * *
alert.severity = 2
alert.track = 1
alert.condition = search count > 0

[ITDN - Rapid Cycle Exfiltration - Rule]
search = index=itdn sourcetype="itdn:alert" rule_name="rapid_cycle" \
  | eval risk_score=90 \
  | table _time, hostname, device_id, severity, description
dispatch.earliest_time = -30m
dispatch.latest_time = now
cron_schedule = */5 * * * *
alert.severity = 4
alert.track = 1
action.email.to = soc@example.com
alert.condition = search count > 0

[ITDN - All Device Events Dashboard]
search = index=itdn sourcetype="itdn:device_event" \
  | stats count by hostname, device_id, event_type \
  | sort - count
dispatch.earliest_time = -24h
dispatch.latest_time = now

[ITDN - Top Hosts by Transfer Volume]
search = index=itdn sourcetype="itdn:device_event" \
  | stats sum(transfer_bytes) as total_bytes by hostname \
  | eval total_gb=round(total_bytes/1073741824, 2) \
  | sort - total_bytes
dispatch.earliest_time = -24h
dispatch.latest_time = now
