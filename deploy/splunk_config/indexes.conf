# Splunk indexes.conf – create the itdn index on your Splunk indexer
#
# Place this file at:
#   $SPLUNK_HOME/etc/system/local/indexes.conf
# (or use Splunk's REST API / deployment server to distribute it)

[itdn]
homePath   = $SPLUNK_DB/itdn/db
coldPath   = $SPLUNK_DB/itdn/colddb
thawedPath = $SPLUNK_DB/itdn/thaweddb
maxDataSize = auto_high_volume
maxTotalDataSizeMB = 500000
frozenTimePeriodInSecs = 31536000
